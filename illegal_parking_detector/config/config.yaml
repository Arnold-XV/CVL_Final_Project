VIDEO_SOURCE: "../../cctv_recordings/f4.mp4"
OUTPUT_VIDEO_PATH: "../outputs/videos/annotated_output_4.mp4"
OUTPUT_LOG_PATH: "../outputs/logs/violations_log_4.csv"
OUTPUT_METRICS_PATH: "../outputs/metrics/evaluation_results_4.json"

INPUT_WIDTH: 1280          # pixel (lebar frame setelah resize)
INPUT_HEIGHT: 720         # pixel (tinggi frame setelah resize)
ROI_DEFINITION_PATH: "../data/roi_definitions/default_roi.json"

MODEL_WEIGHTS_PATH: "../models/yolo26/weights/yolo26s.pt"
DETECTION_CONFIDENCE_THRESHOLD: 0.45  # skor confidence (0-1)
VEHICLE_CLASSES:
  - car
  - truck
  - motorcycle
  - bus

LK_WIN_SIZE: [3, 3]       # ukuran patch (pixel)
LK_MAX_LEVEL: 3           # level piramida
LK_TERM_CRITERIA_EPS: 0.03
LK_TERM_CRITERIA_COUNT: 10
MAX_ASSOCIATION_DISTANCE: 80.0  # pixel (jarak max re-assosiasi)

# Smoothing midpoint untuk mengurangi jitter bbox (0-1, makin besar makin responsif)
MIDPOINT_SMOOTHING_ALPHA: 0.3   # 0-1 (semakin besar = lebih responsif, semakin kecil = lebih halus)

DISPLACEMENT_THRESHOLD: 1.5     # pixel/frame (semakin besar = lebih toleran gerak dianggap diam)
DISPLACEMENT_DEADZONE: 1.25      # pixel/frame (semakin besar = noise kecil makin diabaikan)
MOVING_THRESHOLD: 5.0          # pixel/frame (semakin besar = butuh gerak lebih jelas untuk MOVING)
SMOOTHING_WINDOW_SIZE: 4        # jumlah frame (semakin besar = smoothing lebih kuat tapi lambat respons)
PARKING_DURATION_THRESHOLD: 20.0  # detik (semakin besar = butuh berhenti lebih lama agar ilegal)
MAX_MISSING_FRAMES: 15            # frame (semakin besar = toleransi hilang lebih lama)
STOPPED_MIN_FRAMES: 10          # frame (semakin besar = lebih sulit masuk STOPPED)
MOVING_MIN_FRAMES: 10          # frame (semakin besar = lebih sulit balik MOVING)

# Jalankan deteksi setiap N frame (1 = setiap frame). Contoh: 2 => 15 FPS dari 30 FPS.
DETECTION_FRAME_STRIDE: 3       # frame (semakin besar = lebih cepat tapi akurasi turun)

VIDEO_FPS: 30.0                 # fps sumber (diganti otomatis jika terbaca)
